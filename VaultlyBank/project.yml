    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinkim.vaultly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  VaultlyWidget:
    type: app-extension
    platform: iOS
    sources:
      - VaultlyWidget
      - Vaultly/Shared
      - Vaultly/Theme/AppFont.swift
      - path: Vaultly/Fonts
        type: folder
        buildPhase: resources
    entitlements:
      path: VaultlyWidget/VaultlyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kevinkim.vaultly]
    info:
      path: VaultlyWidget/Info.plist
      properties:
        CFBundleDisplayName: Vaultly
        CFBundleShortVersionString: $(MARKETING_VERSION)   # XcodeGen otherwise writes 1.0 / 1
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [Pretendard-Regular.otf, Pretendard-Medium.otf, Pretendard-SemiBold.otf, Pretendard-Bold.otf, Pretendard-ExtraBold.otf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinkim.vaultly.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  VaultlyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VaultlyTests]
    dependencies:
      - target: Vaultly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinkim.vaultly.tests
        GENERATE_INFOPLIST_FILE: YES
  VaultlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VaultlyUITests]
    dependencies:
      - target: Vaultly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinkim.vaultly.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Vaultly
schemes:
  Vaultly:
    build:
      targets:
        Vaultly: all
        VaultlyWidget: all
        VaultlyTests: [test]
        VaultlyUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Vaultly/Vaultly.storekit
    test:
      config: Debug
      targets: [VaultlyTests, VaultlyUITests]
  Vaultly-Store:
    build:
      targets:
        Vaultly: all
        VaultlyWidget: all
        VaultlyUITests: [test]
    run:
      config: Store
      storeKitConfiguration: Vaultly/Vaultly.storekit
    test:
      config: Store              # the App Store build itself, walked through by the UI tests (scripts/qa.sh)
      targets: [VaultlyUITests]
    archive:
      config: Store
