name: Vaultly
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
targets:
  Vaultly:
    type: application
    platform: iOS
    sources: [Vaultly]
    info:
      path: Vaultly/Info.plist
      properties:
        CFBundleDisplayName: Vaultly
        UILaunchScreen: {}
        UIBackgroundModes: []
        NSUserNotificationsUsageDescription: 예약한 가상 입금 알림을 보내기 위해 알림 권한이 필요합니다.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vaultly
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  VaultlyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VaultlyTests]
    dependencies:
      - target: Vaultly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vaultly.tests
  VaultlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VaultlyUITests]
    dependencies:
      - target: Vaultly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vaultly.uitests
        TEST_TARGET_NAME: Vaultly
schemes:
  Vaultly:
    build:
      targets:
        Vaultly: all
        VaultlyTests: [test]
        VaultlyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [VaultlyTests, VaultlyUITests]
