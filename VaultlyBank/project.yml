name: Vaultly
options:
  bundleIdPrefix: com.kevinkim
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
packages:
  GoogleMobileAds:                      # AdMob (App Store build only uses it; see Services/AdService.swift)
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
  GoogleUserMessagingPlatform:          # UMP consent form (GDPR); its module is `UserMessagingPlatform`
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
configs:
  Debug: debug
  Release: release
  Store: release          # App Store variant: fictional brands only, Pro gating, simulator wording
settings:
  base:
    DEVELOPMENT_TEAM: 6Z44CDGL2Q
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    VAULTLY_DISPLAY_NAME: Vaultly
    VAULTLY_ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511   # Google TEST app id — replace with the real one before submitting
  configs:
    Store:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: STORE
      VAULTLY_DISPLAY_NAME: Vaultly 시뮬레이터
targets:
  Vaultly:
    type: application
    platform: iOS
    sources: [Vaultly]
    dependencies:
      - target: VaultlyWidget
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    entitlements:
      path: Vaultly/Vaultly.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kevinkim.vaultly]
    info:
      path: Vaultly/Info.plist
      properties:
        CFBundleDisplayName: $(VAULTLY_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)   # XcodeGen otherwise writes 1.0 / 1
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: []
        NSSupportsLiveActivities: true
        NSUserNotificationsUsageDescription: 예약한 가상 입금 알림을 보내기 위해 알림 권한이 필요합니다.
        NSFaceIDUsageDescription: 앱 잠금을 해제하기 위해 Face ID를 사용합니다.
        UIAppFonts: [Pretendard-Regular.otf, Pretendard-Medium.otf, Pretendard-SemiBold.otf, Pretendard-Bold.otf, Pretendard-ExtraBold.otf]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.simulation-games   # listed as Games > Simulation
        NSUserTrackingUsageDescription: 허용하면 관심사에 맞는 광고가 표시됩니다. 거부해도 게임의 모든 기능을 똑같이 사용할 수 있습니다.
        GADApplicationIdentifier: $(VAULTLY_ADMOB_APP_ID)
        SKAdNetworkItems:    # Google's published list (developers.google.com/admob/ios/3p-skadnetworks), 50 ids
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
