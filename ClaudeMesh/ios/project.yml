name: ClaudeMesh
options:
  bundleIdPrefix: com.kevinkim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # filled in by build-iphone.sh from your Apple ID team
targets:
  ClaudeMesh:
    type: application
    platform: iOS
    sources: [ClaudeMesh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinkim.claudemesh.ios
        PRODUCT_NAME: Claude Mesh
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Claude Mesh
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing QR code shown in Claude Mesh on your Mac.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to Claude Mesh running on your Mac.
    info:
      path: ClaudeMesh/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true      # the Mac serves plain http on your Wi-Fi / Tailnet
          NSAllowsLocalNetworking: true
